# DB stuff
#
# These are non-authoritative placeholders. The real database credentials come
# from the deployment's EXTERNAL properties file, which is overlaid on top of
# this bundled default at startup (see DrugrefProperties: the bundled file is
# read first, the external file overrides it). The default is deliberately a
# NON-privileged account name with NO password: if the external overlay ever
# fails to load, DrugRef must fail to connect rather than fall back to a
# database superuser with a password published in this source tree. Do not
# restore a `root` user or a real password here.
db_user=drugref
db_password=
db_url=jdbc:mysql://127.0.0.1:3306/drugref
db_driver=com.mysql.cj.jdbc.Driver

sort_down_mfg_tagged_generics=false

interaction_base_url=https://download.oscar-emr.com/ws/rs/accounts
scheduled_timer=300000

#DPD_BASE_URL=https://www.canada.ca/content/dam/hc-sc/documents/services/drug-product-database